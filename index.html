<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Tells the phone to use its real screen width, otherwise the page looks like a tiny desktop site.
     viewport-fit=cover lets the page use the full screen on iPhones with a notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAN Chat</title>

<!-- ################################################################ -->
<!-- ##                                                            ## -->
<!-- ##   LANGUAGE 1 OF 3:  CSS   (how the page looks)             ## -->
<!-- ##   Comments in this part use:  /* comment */                ## -->
<!-- ##                                                            ## -->
<!-- ################################################################ -->
<style>
  /* ############################################################ */
  /* ##  CSS STARTS HERE                                       ## */
  /* ############################################################ */

  /* Colors are defined once as variables, so the rest of the CSS reuses them. */
  :root {
    --bg: #e9eef0; --panel: #ffffff; --ink: #1c2b33; --muted: #6b7c85;
    --mine: #1f5f6b; --mine-ink: #ffffff; --theirs: #ffffff; --line: #d3dde1;
    --ok: #2e9b5f; --bad: #c8453b;
  }
  /* If the phone is in dark mode, swap in dark colors. */
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11181c; --panel: #1a242a; --ink: #e6eef1; --muted: #8fa1aa;
            --mine: #2a7f8e; --theirs: #243139; --line: #2c3a42; }
  }
  /* border-box makes padding count inside an element's width, which keeps sizes predictable. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }

  /* The whole chat screen. 100dvh = exactly the visible phone height (ignores the browser address bar).
     flex + column stacks header, message list and input bar vertically. */
  #app { height: 100dvh; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto;
         background: var(--bg); }

  /* Top bar. The safe-area padding keeps it clear of the phone's notch. */
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px;
           padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.05rem; margin: 0; }
  #who { color: var(--muted); font-size: .85rem; }

  /* Connection indicator: the dot is red by default and turns green when the class "on" is added. */
  #status { font-size: .85rem; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  #status.on #dot { background: var(--ok); }

  /* The message list. flex:1 = take all leftover space, so the input bar stays pinned at the bottom.
     overflow-y:auto = scroll when the messages do not fit. */
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }

  /* One message = a "row" (name + bubble + time). max-width stops a bubble filling the whole screen. */
  .row { display: flex; flex-direction: column; max-width: 75%; }
  /* My messages go to the right, other people's go to the left. */
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .row.theirs { align-self: flex-start; align-items: flex-start; }
  .name { font-size: .75rem; color: var(--muted); margin: 0 6px 2px; }

  /* The bubble. overflow-wrap:anywhere breaks very long words so they cannot overflow the screen.
     white-space:pre-wrap keeps line breaks the user typed. */
  .bubble { padding: 8px 12px; border-radius: 16px; line-height: 1.35; white-space: pre-wrap;
            overflow-wrap: anywhere; background: var(--theirs); border: 1px solid var(--line); }
  /* My bubbles are colored, and the corner nearest the edge is squared to look like a chat tail. */
  .mine .bubble { background: var(--mine); color: var(--mine-ink); border-color: transparent;
                  border-bottom-right-radius: 4px; }
  .theirs .bubble { border-bottom-left-radius: 4px; }
  .time { font-size: .7rem; color: var(--muted); margin: 2px 6px 0; }
  /* A message the server has not confirmed yet is shown faded. */
  .row.pending .bubble { opacity: .55; }
  .sys { align-self: center; font-size: .75rem; color: var(--muted); }

  /* Input bar at the bottom. The safe-area padding keeps it above the iPhone home bar. */
  #bar { display: flex; gap: 8px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
         background: var(--panel); border-top: 1px solid var(--line); }
  /* 16px is the minimum that stops iOS from zooming in when the input is tapped. */
  input, button { font: inherit; font-size: 16px; }
  #text, #nameIn { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 20px;
                   border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { padding: 10px 18px; border: 0; border-radius: 20px; background: var(--mine); color: #fff; cursor: pointer; }

  /* The username screen. position:fixed + inset:0 makes it cover the whole page until the user joins. */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
           justify-content: center; padding: 20px; z-index: 5; }
  #login > div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
                 padding: 22px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  #login h2 { margin: 0; font-size: 1.2rem; }
  /* Needed so the hidden attribute really hides it (display:flex above would otherwise win). */
  #login[hidden] { display: none; }
</style>
</head>
<body>

<!-- ################################################################ -->
<!-- ##                                                            ## -->
<!-- ##   LANGUAGE 2 OF 3:  HTML   (the structure of the page)     ## -->
<!-- ##   Comments in this part look like these banner lines       ## -->
<!-- ##                                                            ## -->
<!-- ################################################################ -->

<!-- Username screen. It covers the page until the user types a name and clicks Join.
     The ids (nameIn, nameGo) are the names the JavaScript uses to find these elements. -->
<div id="login">
  <div>
    <h2>Pick a username</h2>
    <input id="nameIn" maxlength="20" placeholder="e.g. alice" autocomplete="off">
    <button id="nameGo">Join chat</button>
  </div>
</div>

<!-- The chat screen has three stacked parts: header, message list, input bar. -->
<div id="app">
  <!-- Header: title, who I am, and the connection status (dot + text). -->
  <header>
    <div><h1>LAN Chat</h1><div id="who"></div></div>
    <div id="status"><span id="dot"></span><span id="stText">Connecting…</span></div>
  </header>
  <!-- The message list. Empty at first: JavaScript adds one bubble per message.
       aria-live lets screen readers announce new messages. -->
  <div id="log" aria-live="polite"></div>
  <!-- Input bar: the text box and the Send button. maxlength stops huge messages. -->
  <div id="bar">
    <input id="text" placeholder="Type a message" autocomplete="off" maxlength="1000">
    <button id="send">Send</button>
  </div>
</div>

<!-- ################################################################ -->
<!-- ##                                                            ## -->
<!-- ##   LANGUAGE 3 OF 3:  JAVASCRIPT   (the behavior)            ## -->
<!-- ##   Comments in this part use:  // comment                   ## -->
<!-- ##                                                            ## -->
<!-- ################################################################ -->
<script>
// ################################################################
// ##  JAVASCRIPT STARTS HERE
// ################################################################
"use strict";

// ---------- STATE: the page's memory ----------

// My username. It stays null until I join.
let user = null;
// The WebSocket connection object (the live link to the server).
let ws = null;
// How many reconnect attempts failed in a row. It decides how long to wait before the next try.
let retry = 0;
// The highest server message id I have seen in this page session.
// It is sent in "join" so the server knows what to replay after a reconnect.
let lastId = 0;
// Ids of messages already shown. This is the DUPLICATE FILTER: a Set cannot hold the same value twice.
const seen = new Set();
// Links a client_id to the faded bubble on screen, so that bubble can be confirmed later.
const pendingEls = new Map();
// Messages I sent that the server has not confirmed yet, as [{client_id, text}].
// This is what gives "no message loss": anything still in here is resent on reconnect.
let pending = [];

// Shortcut: $("text") means "find the element with id text".
const $ = (id) => document.getElementById(id);
// The message list element, used often below.
const log = $("log");

// ---------- HELPERS ----------

// Builds a unique id from the current time plus random characters, so two messages never share one.
// crypto.randomUUID is not used because it only works on HTTPS, and this app runs on plain http://<ip>.
const newClientId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

// Turns the server timestamp (in seconds) into a readable time such as 02:15 PM.
// It multiplies by 1000 because JavaScript dates use milliseconds.
const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// Updates the status indicator: adds or removes the CSS class "on" (green dot) and changes the label.
function setStatus(online) {
  $("status").classList.toggle("on", online);
  $("stText").textContent = online ? "Connected" : "Reconnecting…";
}

// ---------- DRAWING ONE MESSAGE ----------

// Creates one chat bubble on screen. isPending=true means "sent but not confirmed yet" (shown faded).
function render(m, isPending) {
  // Is this message from me? This single comparison decides left or right.
  const mine = m.user === user;
  // Create the container and give it the classes that position it (and fade it if pending).
  const row = document.createElement("div");
  row.className = "row " + (mine ? "mine" : "theirs") + (isPending ? " pending" : "");
  // Show the sender's name above the bubble, but only for other people's messages.
  if (!mine) {
    const n = document.createElement("div");
    n.className = "name";
    // textContent, never innerHTML: a message that contains HTML tags or script code is shown
    // as plain text and never runs. This blocks HTML/script injection.
    n.textContent = m.user;
    row.appendChild(n);
  }
  // The bubble holding the message text (again via textContent for safety).
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = m.text;
  // The small time label under the bubble. It reads "sending…" until the server confirms.
  const t = document.createElement("div");
  t.className = "time";
  t.textContent = isPending ? "sending…" : fmtTime(m.ts);
  // Put bubble and time in the row, add the row to the list, and scroll down to the newest message.
  row.append(b, t);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  // Return the element so it can be updated later (used for confirming my pending messages).
  return row;
}

// ---------- INCOMING MESSAGES ----------

// Every message from the server goes through here (live ones and history replays alike).
function handleMsg(m) {
  // DUPLICATE FILTER: if this id was already shown, stop. History replay can overlap live messages.
  if (seen.has(m.id)) return;
  // Otherwise remember it, and keep track of the highest id seen (needed for the next "join").
  seen.add(m.id);
  lastId = Math.max(lastId, m.id);

  // If the message carries the client_id of something I sent, this is the server confirming MY message.
  // Update the faded bubble instead of drawing a second one.
  if (m.client_id && pendingEls.has(m.client_id)) {
    const row = pendingEls.get(m.client_id);
    // Remove the faded look and replace "sending…" with the real time.
    row.classList.remove("pending");
    row.querySelector(".time").textContent = fmtTime(m.ts);
    // It is confirmed now, so forget it in both pending structures.
    pendingEls.delete(m.client_id);
    pending = pending.filter((p) => p.client_id !== m.client_id);
    return;
  }
  // Otherwise it is someone else's message: draw it normally.
  render(m, false);
}

// ---------- CONNECTION ----------

// Sends an object to the server as JSON text, but only if the connection is open.
// Returns false otherwise. Nothing is lost then, because unsent messages stay in "pending".
function sendJSON(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
  return false;
}

// Opens the WebSocket and defines what happens on open, message, close and error.
function connect() {
  // Use wss:// if the page is on HTTPS, otherwise ws://.
  const proto = location.protocol === "https:" ? "wss" : "ws";
  // location.host = whatever address served this page, so it works on localhost AND on the phone unchanged.
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  // Runs when the connection succeeds.
  ws.onopen = () => {
    // Reset the backoff counter and turn the status green.
    retry = 0;
    setStatus(true);
    // Tell the server who I am and the last message I saw, so it replays everything I missed.
    sendJSON({ type: "join", user, last_id: lastId });
    // Resend every message the server has not confirmed. The server ignores ones it already has
    // (same client_id), so resending is safe.
    pending.forEach((p) => sendJSON({ type: "msg", client_id: p.client_id, text: p.text }));
  };

  // Runs for each message from the server.
  ws.onmessage = (e) => {
    // Parse the JSON text; ignore anything malformed instead of crashing.
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    // "history" holds a list of old messages, so each one goes through handleMsg.
    if (m.type === "history") (m.messages || []).forEach(handleMsg);
    // A single live message goes through handleMsg directly.
    else if (m.type === "msg") handleMsg(m);
  };

  // Runs when the connection drops (Wi-Fi lost, server stopped, airplane mode...).
  ws.onclose = () => {
    // Show "Reconnecting…" and a red dot.
    setStatus(false);
    // Exponential backoff: wait 1s, 2s, 4s, 8s, then 10s at most, so a down server is not hammered.
    const delay = Math.min(1000 * 2 ** retry, 10000);
    retry++;
    // Try again after the delay.
    setTimeout(connect, delay);
  };
  // On an error, close the socket so that onclose runs and the reconnect logic starts.
  ws.onerror = () => ws.close();
}

// ---------- OUTGOING MESSAGES ----------

// Runs when I press Send or Enter.
function sendMessage() {
  // Read the box and trim spaces from both ends. Do nothing if it is empty.
  const input = $("text");
  const text = input.value.trim();
  if (!text) return;
  // Give this message a unique id, so the server can recognize it if it is ever sent twice.
  const client_id = newClientId();
  // Keep it in the pending list until the server echoes it back. This is the "no message loss" part.
  pending.push({ client_id, text });
  // Show a faded bubble immediately, and remember it so it can be confirmed later.
  pendingEls.set(client_id, render({ user, text, ts: Date.now() / 1000 }, true));
  // Try to send now. If I am offline this quietly fails, and the message goes out on reconnect (see onopen).
  sendJSON({ type: "msg", client_id, text });
  // Clear the box and keep the cursor in it.
  input.value = "";
  input.focus();
}

// ---------- STARTUP ----------

// Runs once I have chosen a username.
function start(name) {
  // Remember my name, and save it in the browser so it is prefilled next time.
  user = name;
  localStorage.setItem("chat_user", name);
  // Show who I am, hide the username screen, and open the connection.
  $("who").textContent = "Signed in as " + name;
  $("login").hidden = true;
  connect();
}

// Wire up the controls: Join button and Enter key on the username box.
$("nameGo").onclick = () => { const n = $("nameIn").value.trim(); if (n) start(n); };
$("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("nameGo").click(); });
// Wire up sending: the Send button and the Enter key in the message box.
$("send").onclick = sendMessage;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

// Prefill the username box with the last name used, and focus it so I can just press Enter.
$("nameIn").value = localStorage.getItem("chat_user") || "";
$("nameIn").focus();
</script>
</body>
</html>
